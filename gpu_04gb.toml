# Butterfly RL - GPU tier: ~4GB VRAM
# Target hardware examples: GTX 1650, RTX 3050 laptop, MX-series
# Network architecture and image_size are left at defaults on purpose.

[training]
num_envs            = 8
rollout_length      = 128
minibatch_size      = 128
checkpoint_interval = 10
log_interval        = 5

[network]
# Small entity transformer for the low-VRAM tier; keeps the added per-frame
# attention cost minimal. Other network settings use defaults.
food_type_embedding_dim  = 4
bird_state_embedding_dim = 4

[network.entity_transformer]
heads       = 1
feedforward = 96
layers      = 1