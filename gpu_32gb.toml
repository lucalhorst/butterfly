# Butterfly RL - GPU tier: ~32GB VRAM
# Target hardware examples: V100 32GB, A100 (partitioned), RTX 5090-class
# Network architecture and image_size are left at defaults on purpose.

[training]
num_envs            = 64
rollout_length      = 1024
minibatch_size      = 2048
checkpoint_interval = 20
log_interval        = 10

[network]
entity_transformer_heads       = 2
entity_transformer_layers      = 2
entity_transformer_feedforward = 256
food_type_embedding_dim        = 8
bird_state_embedding_dim       = 8
