# Butterfly RL - GPU tier: ~16GB VRAM
# Target hardware examples: RTX 4080, RTX 4070 Ti Super, A4000
# Network architecture and image_size are left at defaults on purpose.

[training]
num_envs            = 32
rollout_length      = 512
minibatch_size      = 512
checkpoint_interval = 15
log_interval        = 5

[network]
food_type_embedding_dim  = 8
bird_state_embedding_dim = 8

[network.entity_transformer]
heads       = 2
feedforward = 192
layers      = 1