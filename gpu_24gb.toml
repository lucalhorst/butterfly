# Butterfly RL - GPU tier: ~24GB VRAM
# Target hardware examples: RTX 3090, RTX 4090, A5000
# Network architecture and image_size are left at defaults on purpose.

[training]
num_envs            = 48
rollout_length      = 512
minibatch_size      = 1024
checkpoint_interval = 15
log_interval        = 5

[network]
food_type_embedding_dim  = 8
bird_state_embedding_dim = 8

[network.entity_transformer]
heads       = 2
feedforward = 256
layers      = 2