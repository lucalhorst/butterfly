# Butterfly RL - GPU tier: ~8GB VRAM
# Target hardware examples: RTX 3060, RTX 4060, RTX 2070
# Network architecture and image_size are left at defaults on purpose.

[training]
num_envs            = 16
rollout_length      = 256
minibatch_size      = 256
checkpoint_interval = 10
log_interval        = 5

[network]
food_type_embedding_dim  = 6
bird_state_embedding_dim = 6

[network.entity_transformer]
heads       = 2
feedforward = 128
layers      = 1