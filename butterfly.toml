[training]
rollout_length      = 512
ppo_epochs          = 4
minibatch_size      = 256
gamma               = 0.99
gae_lambda          = 0.95
clip_epsilon        = 0.2
learning_rate       = 3e-4
entropy_coef        = 0.01
value_coef          = 0.5
num_envs            = 4
gradient_max_norm   = 0.5
checkpoint_interval = 5
log_interval        = 5
log_csv             = true
log_tensorboard     = true

[environment]
image_size                = 64
max_steps                 = 100000
history_length            = 8
food_track_limit          = 15
food_detection_radius     = 1.0
max_birds                 = 1
initial_hunger            = 1.0
hunger_depletion_per_step = 0.0002
food_hunger_restore       = 0.35
butterfly_speed           = 0.035

[environment.rewards]
base_step            = -0.002
movement_scale       = 0.02
eating_distance      = 0.55
eating_reward        = 6.0
hunger_death_penalty = -5.0
bird_kill_penalty    = -10.0

[world]
chunk_size              = 16
chunks_loaded           = 4
plants_per_chunk        = 100
day_cycle_length        = 100
day_duration            = 50
night_duration          = 50
plant_cooldown          = 25
interval_phases_max     = 3
day_night_cycle_enabled = true
plant_types             = ["day", "night", "interval", "random"]
plant_type_probs        = [0.35, 0.35, 0.2, 0.1]

[world.plant_types_enabled]
day      = true
night    = true
interval = true
random   = true

[predator]
enabled         = true
speed           = 0.025
detection_range = 0.3
chase_speed     = 0.035
patrol_range    = 2.0

[network]
feature_size                    = 256
temporal_transformer_heads      = 8
temporal_transformer_feedforward = 512
temporal_transformer_dropout    = 0.1
temporal_transformer_layers     = 3
entity_transformer_heads        = 2
entity_transformer_feedforward  = 192
entity_transformer_dropout      = 0.1
entity_transformer_layers       = 1
food_type_embedding_dim         = 8
bird_state_embedding_dim        = 8

[rendering]
window_size = 600
play_seed   = 123
