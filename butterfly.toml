[training]
rollout_length      = 512
ppo_epochs          = 4
minibatch_size      = 256
gamma               = 0.99
gae_lambda          = 0.95
clip_epsilon        = 0.2
learning_rate       = 3e-4
entropy_coef        = 0.01
value_coef          = 0.5
num_envs            = 4
gradient_max_norm   = 0.5
checkpoint_interval = 5
log_interval        = 5
log_csv             = true
log_tensorboard     = true

[environment]
image_size      = 64
pixels_per_unit = 1.0
max_steps       = 10000
history_length  = 8

[butterfly]
speed                     = 0.5
initial_hunger            = 1.0
hunger_depletion_per_step = 0.0002

[butterfly.rewards]
base_step            = -0.002
movement_scale       = 0.02
eating_distance      = 0.55
eating_reward        = 6.0
hunger_death_penalty = -5.0
kill_penalty         = -10.0

[butterfly.perception]
detection_radius  = 8
track_limit       = 5
max_tracked_birds = 10

[bird]
enabled           = true
population        = 10
speed             = 0.25
detection_radius  = 8
chase_speed       = 0.35
patrol_range      = 8.0
spawn_radius      = 50.0

[plant]
plants_per_chunk  = 2
cooldown          = 25
types             = ["day", "night", "interval", "random"]
type_probs        = [0.35, 0.35, 0.2, 0.1]
hunger_restore    = 0.35
interval_phases_max = 3

[plant.types_enabled]
day      = true
night    = true
interval = true
random   = true

[world]
chunk_size              = 16
chunks_loaded           = 16
day_cycle_length        = 100
day_duration            = 50
night_duration          = 50
day_night_cycle_enabled = true

[network]
feature_size             = 256
food_type_embedding_dim  = 8
bird_state_embedding_dim = 8

[network.temporal_transformer]
heads       = 8
feedforward = 512
dropout     = 0.1
layers      = 3

[network.entity_transformer]
heads       = 2
feedforward = 192
dropout     = 0.1
layers      = 1

[rendering]
window_size       = 600
stats_panel_width = 350
obs_panel_width   = 140
play_seed         = 123